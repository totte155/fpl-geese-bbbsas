name: Weekly story

# Polls every 15 minutes so the Teamsheet can go out at the gameweek's first
# kick-off. notify.py decides whether anything is due, so most runs do nothing.

on:
  schedule:
    # Two emails per gameweek, no more — notify.py decides. These are just the
    # checks that catch the right moment.
    #
    # Kick-off times move week to week, so a fixed cron can't target them; this
    # polls and fires on the first check at or after the first whistle. Every
    # 20 min from 10:00–22:59 UTC covers every Premier League kick-off slot and
    # the window FPL verifies results in. Hourly overnight is just a safety net.
    - cron: "*/20 10-22 * * *"
    - cron: "0 23,0-9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chromium renders the weekly graphic. Only installed when a story is
      # actually due — most runs skip this and finish in a couple of seconds.
      - name: Is anything due?
        id: due
        run: python notify.py --due

      - name: Install Chromium for the graphic
        if: steps.due.outputs.due == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Decide and build
        id: build
        env:
          SITE_URL: https://totte155.github.io/fpl-geese-bbbsas/
        run: python notify.py

      # Turns "At least one of 'to', 'cc' or 'bcc' must be specified" into a
      # message that names the missing secret. Prints lengths only, never
      # values, so nothing sensitive reaches the public log.
      - name: Check mail secrets are visible
        if: steps.build.outputs.send == 'true'
        env:
          U: ${{ secrets.MAIL_USERNAME }}
          P: ${{ secrets.MAIL_PASSWORD }}
          T: ${{ secrets.MAIL_TO }}
        run: |
          echo "MAIL_USERNAME length: ${#U}"
          echo "MAIL_PASSWORD length: ${#P}"
          echo "MAIL_TO       length: ${#T}"
          missing=""
          [ -z "$U" ] && missing="$missing MAIL_USERNAME"
          [ -z "$P" ] && missing="$missing MAIL_PASSWORD"
          [ -z "$T" ] && missing="$missing MAIL_TO"
          if [ -n "$missing" ]; then
            echo "::error::Not reaching this workflow:$missing — add them under"\
                 "Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "All three secrets are visible to the workflow."

      - name: Email the group
        if: steps.build.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.build.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: FPL H2H <${{ secrets.MAIL_USERNAME }}>
          html_body: file://${{ steps.build.outputs.body_file }}
          convert_markdown: false
          # The graphic rides along as an attachment, so it can be saved and
          # forwarded straight into WhatsApp.
          attachments: ${{ steps.build.outputs.image }}

      # Only once the email has genuinely gone out. Keeping this separate from
      # the build step means a mail failure leaves the week un-ticked, so it is
      # retried on the next run rather than silently skipped.
      - name: Record as sent
        if: success() && steps.build.outputs.send == 'true'
        run: python notify.py --mark "${{ steps.build.outputs.kind }}" "${{ steps.build.outputs.gw }}"

      # always() so the archive page still updates even when the email fails —
      # otherwise a mail problem also freezes the website.
      - name: Commit the story and archive
        if: always()
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add stories stories.html
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Season story update"
            git pull --rebase --autostash
            git push
          fi

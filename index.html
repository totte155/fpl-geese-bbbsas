<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>FPL Geese vs BBBSAS — H2H 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1220; --panel:#121c30; --panel-2:#0f1728;
    --line:#22304c; --text:#e9eefb; --muted:#8593ad;
    --geese:#1f8ef1; --bbbsas:#8b5cf6; --draw:#64748b;
    --geese-soft:rgba(31,142,241,.14); --bbbsas-soft:rgba(139,92,246,.14);
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 520px at 50% -12%, #16223c 0%, transparent 60%),
      var(--ink);
    color:var(--text); font-family:var(--body);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding:0 16px 64px; min-height:100vh;
  }
  .wrap{max-width:760px; margin:0 auto}

  /* Header */
  header{padding:26px 2px 10px; display:flex; align-items:baseline;
    justify-content:space-between; gap:12px; flex-wrap:wrap}
  .eyebrow{font-family:var(--display); font-weight:600; letter-spacing:.22em;
    text-transform:uppercase; font-size:13px; color:var(--muted)}
  .eyebrow b{color:var(--text); font-weight:700}
  .stamp{font-size:12px; color:var(--muted); letter-spacing:.02em;
    display:inline-flex; align-items:center; gap:10px}
  .refresh{appearance:none; border:1px solid var(--line); background:var(--panel);
    color:var(--text); font-family:var(--body); font-size:12px; font-weight:500;
    padding:5px 11px; border-radius:999px; cursor:pointer; display:inline-flex;
    align-items:center; gap:6px; transition:border-color .15s ease, background .15s ease}
  .refresh:hover{border-color:var(--geese); background:#16233a}
  .refresh:disabled{opacity:.6; cursor:default}
  .refresh svg{width:13px; height:13px; display:block}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Player links */
  a.player{color:inherit; text-decoration:none; border-bottom:1px dotted rgba(255,255,255,.28)}
  a.player:hover{border-bottom-color:currentColor}
  .roster a.player{color:inherit; border-bottom:none}
  .roster a.player:hover{text-decoration:underline}

  /* Sample banner */
  .banner{margin:8px 2px 0; padding:10px 14px; border:1px solid var(--line);
    border-left:3px solid #f0b429; border-radius:10px; background:var(--panel-2);
    font-size:13px; color:#e8d9a8}
  .banner strong{color:#f4c95d}

  /* Hero scoreboard */
  .board{position:relative; margin-top:18px; border:1px solid var(--line);
    border-radius:18px; background:linear-gradient(180deg,var(--panel),var(--panel-2));
    padding:26px 20px 22px; overflow:hidden}
  .board::before{content:""; position:absolute; top:18px; bottom:56px; left:50%;
    width:2px; transform:translateX(-1px);
    background:linear-gradient(180deg,transparent,var(--line) 22%,var(--line) 78%,transparent)}
  .duel{display:grid; grid-template-columns:1fr 1fr; align-items:start}
  .side{display:flex; flex-direction:column; gap:6px}
  .side.geese{align-items:flex-start; text-align:left}
  .side.bbbsas{align-items:flex-end; text-align:right}
  .badge{display:inline-flex; align-items:center; gap:8px; font-family:var(--display);
    font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:15px}
  .dot{width:11px; height:11px; border-radius:3px; flex:0 0 auto}
  .roster{font-size:12.5px; color:var(--muted); letter-spacing:.01em; max-width:15ch}
  .tally{font-family:var(--display); font-weight:800; font-size:76px; line-height:.9;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; margin-top:4px}
  .side.geese .tally{color:var(--geese)}
  .side.bbbsas .tally{color:var(--bbbsas)}
  .caplabel{font-family:var(--display); font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; font-size:11px; color:var(--muted)}

  .verdict{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:var(--display); font-size:20px; font-weight:600; letter-spacing:.02em}
  .verdict .lead-team{font-weight:800}
  .pill{font-family:var(--display); font-weight:700; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; padding:3px 10px; border-radius:999px;
    border:1px solid var(--line)}

  /* Live panel */
  .live{margin-top:16px; border:1px solid var(--line); border-radius:16px;
    background:var(--panel-2); overflow:hidden}
  .live-top{display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:13px 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(240,180,41,.06),transparent)}
  .live-tag{display:inline-flex; align-items:center; gap:8px; font-family:var(--display);
    font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:13px}
  .live-tag.upcoming{color:var(--muted)}
  .live-dot{width:9px; height:9px; border-radius:50%; background:#f0b429;
    box-shadow:0 0 0 0 rgba(240,180,41,.6); animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,180,41,.55)}
    70%{box-shadow:0 0 0 8px rgba(240,180,41,0)}100%{box-shadow:0 0 0 0 rgba(240,180,41,0)}}
  .live-prov{font-family:var(--display); font-weight:700; font-size:14px;
    letter-spacing:.02em; color:var(--muted)}
  .live-prov b{font-variant-numeric:tabular-nums}
  .live-fx{display:flex; flex-direction:column}
  .lrow{display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:10px; padding:11px 16px}
  .lrow + .lrow{border-top:1px solid var(--line)}
  .lname{font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px}
  .lname.g{color:var(--geese)} .lname.b{color:var(--bbbsas); justify-content:flex-end}
  .lscore{font-family:var(--display); font-weight:800; font-size:22px;
    font-variant-numeric:tabular-nums; min-width:78px; text-align:center; letter-spacing:.02em}
  .lscore .sep{color:var(--muted); font-weight:600; margin:0 4px}
  .ahead{opacity:1} .behind{opacity:.5}
  .chev{color:var(--muted); font-size:11px; margin-left:2px; flex:0 0 auto}

  /* Team links (bottom) */
  .teamlinks{margin-top:30px; border:1px solid var(--line); border-radius:14px;
    background:var(--panel-2); padding:14px 16px}
  .teamlinks .tl-head{font-family:var(--display); font-weight:700; font-size:13px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .tl-grid{display:flex; flex-wrap:wrap; gap:8px}
  .tl-grid a{display:inline-flex; align-items:center; gap:7px; font-size:13px;
    text-decoration:none; border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; background:var(--panel); transition:border-color .15s ease}
  .tl-grid a:hover{border-color:currentColor}
  .live-foot{padding:10px 16px 12px; font-size:12px; color:var(--muted);
    border-top:1px solid var(--line); letter-spacing:.01em}

  /* Fixture detail modal */
  .modal{position:fixed; inset:0; background:rgba(5,9,18,.72); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; z-index:50; padding:0}
  .modal.open{display:flex}
  .sheet{width:100%; max-width:620px; max-height:88vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:0 0 22px}
  @media (min-width:640px){
    .modal{align-items:center; padding:24px}
    .sheet{border-radius:18px}
  }
  .sheet-top{position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line);
    padding:16px 18px 13px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .sheet-title{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:.01em}
  .sheet-sub{font-size:12px; color:var(--muted); margin-top:3px}
  .xbtn{appearance:none; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); width:30px; height:30px; border-radius:50%; cursor:pointer;
    font-size:16px; line-height:1; flex:0 0 auto}
  .xbtn:hover{border-color:var(--geese)}

  .caps{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 18px 6px}
  .cap{border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--panel-2)}
  .cap .who{font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase;
    font-family:var(--display); font-weight:600}
  .cap .pl{font-weight:600; font-size:15px; margin-top:3px; display:flex; align-items:center;
    gap:6px; flex-wrap:wrap}
  .cap .pts{font-family:var(--display); font-weight:800; font-size:20px; margin-top:2px;
    font-variant-numeric:tabular-nums}
  .tagmini{font-size:10px; color:var(--muted); border:1px solid var(--line);
    padding:1px 5px; border-radius:4px; letter-spacing:.04em}
  .samecap{margin:8px 18px 0; padding:8px 11px; border-radius:9px; font-size:12.5px;
    background:rgba(240,180,41,.09); border:1px solid rgba(240,180,41,.28); color:#f4c95d}

  /* Comparison table */
  .cmp{width:100%; border-collapse:collapse; margin:4px 0 0}
  .cmp th, .cmp td{padding:7px 8px; vertical-align:middle}
  .cmp thead th{font-family:var(--display); font-weight:700; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line)}
  .cmp thead th.l{text-align:left; color:var(--geese)}
  .cmp thead th.r{text-align:right; color:var(--bbbsas)}
  .cmp tbody tr{border-bottom:1px solid rgba(34,48,76,.5)}
  .cmp tbody tr:last-child{border-bottom:none}
  .cmp td.nm{font-size:13px; max-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; width:38%}
  .cmp td.nm.r{text-align:right}
  .cmp td.nm .club{font-size:10.5px; color:var(--muted); margin-left:5px}
  .cmp td.pt{font-family:var(--display); font-weight:700; font-size:16px;
    font-variant-numeric:tabular-nums; width:12%; text-align:center}
  .cmp td.pt.g{color:var(--geese)} .cmp td.pt.b{color:var(--bbbsas)}
  .cmp td.blank{color:var(--muted); font-size:12px; opacity:.35}
  .cmp tr.caprow{background:rgba(240,180,41,.05)}
  .cmp tr.caprow td.nm{font-weight:600}
  .cmp tr.caprow td.pt{font-size:17px}
  .cmp tr.caprow td.pt::after{content:""}
  .caprow-lbl{display:none}
  @media (max-width:430px){
    .cmp tr.caprow td.nm{position:relative}
  }
  .capmark{font-family:var(--display); font-size:9.5px; font-weight:700; color:#f0b429;
    border:1px solid rgba(240,180,41,.45); border-radius:4px; padding:0 4px; margin-right:5px}
  .cmp tfoot td{border-top:1px solid var(--line); font-family:var(--display);
    font-weight:800; font-size:16px; padding-top:9px}
  .cmp tfoot td.lab{font-family:var(--body); font-size:11.5px; font-weight:500;
    color:var(--muted); letter-spacing:.02em; text-transform:uppercase}
  .cmpwrap{padding:4px 18px 0}
  .sectlbl{padding:16px 18px 2px; font-family:var(--display); font-weight:700;
    font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .nodiff{color:var(--muted); font-size:12.5px; padding:8px 18px}
  .swing{padding:12px 18px 0; font-size:12.5px; color:var(--muted)}
  @media (max-width:430px){
    .cmp td.nm{font-size:12px} .cmp td.pt{font-size:15px; width:14%}
    .cmp td.nm .club{display:none}
    .cmp tr.caprow td.nm .capmark{display:none}
    .cmpwrap{padding:4px 12px 0} .sectlbl{padding-left:12px}
  }
  .clickable{cursor:pointer}
  .lrow.clickable:hover, .fx.clickable:hover{background:rgba(255,255,255,.03)}

  /* Section heading */
  .sechead{display:flex; align-items:baseline; gap:12px; margin:34px 4px 12px}
  .sechead h2{font-family:var(--display); font-weight:700; letter-spacing:.02em;
    font-size:22px; margin:0}
  .sechead .sub{font-size:12.5px; color:var(--muted)}

  /* Chart */
  .chartcard{border:1px solid var(--line); border-radius:16px; background:var(--panel-2);
    padding:16px 12px 10px}
  .chart-legend{display:flex; gap:18px; padding:2px 6px 10px; font-size:13px; color:var(--muted)}
  .chart-legend span{display:inline-flex; align-items:center; gap:7px}
  .chart-legend i{width:14px; height:3px; border-radius:2px; display:inline-block}
  svg{display:block; width:100%; height:auto}
  .race-line{fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
  .race-mark{stroke:var(--panel-2); stroke-width:2}
  .grid-line{stroke:var(--line); stroke-width:1}
  .axis-txt{fill:var(--muted); font-family:var(--body); font-size:11px}

  /* Weekly scorecards */
  .rail{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 14px;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{height:6px}
  .rail::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
  .card{scroll-snap-align:start; flex:0 0 auto; width:132px; border:1px solid var(--line);
    border-radius:14px; background:var(--panel); padding:12px 12px 10px; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease}
  .card:hover{transform:translateY(-2px)}
  .card .gw{font-family:var(--display); font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; font-size:11px; color:var(--muted)}
  .card .cscore{font-family:var(--display); font-weight:800; font-size:34px;
    font-variant-numeric:tabular-nums; margin:2px 0 2px}
  .card .cwin{font-size:12px; font-weight:600; letter-spacing:.04em}
  .card .fixtures{margin-top:10px; padding-top:9px; border-top:1px solid var(--line);
    display:none; flex-direction:column; gap:6px}
  .card.open .fixtures{display:flex}
  .fx{display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:11.5px}
  .fx .nm{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46px}
  .fx .sc{font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:.02em; white-space:nowrap}
  .fx .g{color:var(--geese)} .fx .b{color:var(--bbbsas)} .fx .d{color:var(--draw)}
  .tap-hint{font-size:11px; color:var(--muted); margin:-4px 4px 0; letter-spacing:.01em}

  /* Empty state */
  .empty{border:1px dashed var(--line); border-radius:16px; background:var(--panel-2);
    padding:34px 24px; text-align:center; color:var(--muted)}
  .empty h3{font-family:var(--display); font-weight:700; color:var(--text);
    font-size:22px; margin:0 0 6px}

  footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); display:flex; justify-content:space-between;
    gap:12px; flex-wrap:wrap}
  a{color:var(--geese)}

  @media (max-width:420px){
    .tally{font-size:60px} .board{padding:22px 14px 18px}
    .roster{max-width:12ch}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><b>FPL Geese</b> vs <b>BBBSAS</b> · H2H 2026/27</div>
    <div class="stamp">
      <span id="stamp-txt"></span>
      <button class="refresh" id="refresh" title="Fetch the latest saved scores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
        <span id="refresh-label">Refresh</span>
      </button>
    </div>
  </header>

  <div id="banner"></div>
  <div id="app"><div class="empty"><h3>Loading…</h3><p>Fetching the latest league data.</p></div></div>

  <div class="teamlinks" id="teamlinks"></div>

  <footer>
    <div id="rosters"></div>
    <div>Updates automatically each gameweek.</div>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Fixture detail">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const EN_DASH = "\u2013";
const q = (s) => document.querySelector(s);

let LAST_DATA = null;

function relTime(iso){
  try{
    const then = new Date(iso), mins = Math.round((Date.now() - then) / 60000);
    if(mins < 1) return "Updated just now";
    if(mins === 1) return "Updated 1 min ago";
    if(mins < 60) return `Updated ${mins} mins ago`;
    const hrs = Math.round(mins/60);
    if(hrs === 1) return "Updated 1 hour ago";
    if(hrs < 24) return `Updated ${hrs} hours ago`;
    return "Updated " + then.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  }catch(e){ return ""; }
}

// Link a manager's name through to their FPL team for a given gameweek.
function fplLink(name, gw, cls){
  const ids = (LAST_DATA && LAST_DATA.entry_ids) || {};
  const id = ids[name];
  const safe = String(name);
  if(!id) return safe;
  const gwPart = gw ? `/event/${gw}` : "";
  return `<a class="player ${cls||""}" target="_blank" rel="noopener"
    href="https://fantasy.premierleague.com/en/entry/${id}${gwPart}"
    title="Open ${safe}'s FPL team">${safe}</a>`;
}

function rosterLinks(players, gw){
  return players.map(p => fplLink(p, gw)).join(" · ");
}

function fmtStamp(iso){ return relTime(iso); }

function shortName(teamName, data){
  if(teamName === data.teams.geese.name) return "FPL Geese";
  if(teamName === data.teams.bbbsas.name) return data.teams.bbbsas.short || "BBBSAS";
  return teamName;
}

function render(data){
  LAST_DATA = data;
  const refGw = (data.live && data.live.gw)
    || (data.gameweeks.length ? data.gameweeks[data.gameweeks.length-1].gw : 1);

  q("#stamp-txt").textContent = fmtStamp(data.generated_at);

  const linkChip = (name, colour) => {
    const id = (data.entry_ids||{})[name];
    if(!id) return "";
    return `<a href="https://fantasy.premierleague.com/en/entry/${id}/event/${refGw}"
      target="_blank" rel="noopener" style="color:${colour}">
      <span class="dot" style="background:${colour}"></span>${name}</a>`;
  };
  q("#teamlinks").innerHTML =
    `<div class="tl-head">Open FPL teams · GW ${refGw}</div><div class="tl-grid">`
    + data.teams.geese.players.map(p=>linkChip(p,"var(--geese)")).join("")
    + data.teams.bbbsas.players.map(p=>linkChip(p,"var(--bbbsas)")).join("")
    + `</div>`;

  q("#rosters").innerHTML =
    `<span style="color:var(--geese)">${data.teams.geese.players.join(", ")}</span>`
    + " · " +
    `<span style="color:var(--bbbsas)">${data.teams.bbbsas.players.join(", ")}</span>`;

  if(data._sample){
    q("#banner").innerHTML =
      `<div class="banner"><strong>Sample data.</strong> Add the eight FPL Entry IDs to `
      + `<code>update_data.py</code> and the real scores will replace this automatically.</div>`;
  }

  const g = data.totals.geese, b = data.totals.bbbsas;
  const leadTeam = data.leader.team, margin = data.leader.margin;

  let verdict;
  if(leadTeam === "Level"){
    verdict = `<span class="pill">All square</span>`;
  }else{
    const cls = leadTeam === data.teams.geese.name ? "geese" : "bbbsas";
    const col = leadTeam === data.teams.geese.name ? "var(--geese)" : "var(--bbbsas)";
    verdict = `<span class="lead-team" style="color:${col}">${shortName(leadTeam,data)}</span>`
      + `<span>lead by</span>`
      + `<span class="pill" style="border-color:${col};color:${col}">${margin} pt${margin===1?"":"s"}</span>`;
  }

  const board = `
    <div class="board">
      <div class="duel">
        <div class="side geese">
          <span class="badge"><span class="dot" style="background:var(--geese)"></span>FPL Geese</span>
          <span class="roster">${data.teams.geese.players.join(" · ")}</span>
          <span class="tally">${g}</span>
          <span class="caplabel">H2H points</span>
        </div>
        <div class="side bbbsas">
          <span class="badge">BBBSAS<span class="dot" style="background:var(--bbbsas)"></span></span>
          <span class="roster">${data.teams.bbbsas.players.join(" · ")}</span>
          <span class="tally">${b}</span>
          <span class="caplabel">H2H points</span>
        </div>
      </div>
      <div class="verdict">${verdict}</div>
    </div>`;

  const livePanel = liveBlock(data);
  const played = data.gameweeks.length;
  if(played === 0){
    q("#app").innerHTML = board + livePanel + `
      <div class="sechead"><h2>The season hasn't kicked off</h2></div>
      <div class="empty">
        <h3>No completed gameweeks yet</h3>
        <p>Results will appear here after GW1 finishes and every manager's score is in.</p>
      </div>`;
    bindHandlers();
    return;
  }

  q("#app").innerHTML = board + livePanel
    + `<div class="sechead"><h2>How the lead has moved</h2>
         <span class="sub">Cumulative H2H points · ${played} of ${data.last_gameweek} GWs</span></div>`
    + `<div class="chartcard">
         <div class="chart-legend">
           <span><i style="background:var(--geese)"></i>FPL Geese</span>
           <span><i style="background:var(--bbbsas)"></i>BBBSAS</span>
         </div>${chart(data)}
       </div>`
    + `<div class="sechead"><h2>Week by week</h2>
         <span class="sub">Tap a card for the four fixtures</span></div>`
    + `<div class="rail" id="rail">${data.gameweeks.map(gwCard.bind(null,data)).join("")}</div>`;

  bindHandlers();
  const rail = q("#rail"); if(rail) rail.scrollLeft = rail.scrollWidth;
}

function liveBlock(data){
  const L = data.live;
  if(!L) return "";                       // competition finished / no data
  const upcoming = L.status === "upcoming";

  const tag = upcoming
    ? `<span class="live-tag upcoming">GW ${L.gw} · Up next</span>`
    : `<span class="live-tag" style="color:#f0b429"><span class="live-dot"></span>GW ${L.gw} · Live</span>`;

  const prov = upcoming ? ""
    : `<span class="live-prov">Provisional <b>${L.provisional_score}</b></span>`;

  const rows = L.fixtures.map(f=>{
    const gAhead = !upcoming && f.leader === data.teams.geese.name;
    const bAhead = !upcoming && f.leader === data.teams.bbbsas.name;
    const gScore = upcoming ? "–" : f.geese_score;
    const bScore = upcoming ? "–" : f.bbbsas_score;
    const key = fxKey(L.gw, f.geese_player, f.bbbsas_player);
    FIXTURE_INDEX[key] = {fixture:f, gw:L.gw};
    return `<div class="lrow clickable" data-fx="${key}" title="Tap for captains and differentials">
      <span class="lname g ${gAhead?'ahead':(bAhead?'behind':'')}">
        <span class="dot" style="background:var(--geese)"></span>${f.geese_player}</span>
      <span class="lscore"><span class="${gAhead?'ahead':(bAhead?'behind':'')}">${gScore}</span>
        <span class="sep">${EN_DASH}</span>
        <span class="${bAhead?'ahead':(gAhead?'behind':'')}">${bScore}</span></span>
      <span class="lname b ${bAhead?'ahead':(gAhead?'behind':'')}">${f.bbbsas_player}
        <span class="dot" style="background:var(--bbbsas)"></span>
        <span class="chev">›</span></span>
    </div>`;
  }).join("");

  const foot = upcoming
    ? `This week's four matchups. Scores appear here live once the gameweek kicks off.`
    : `Tap any matchup for captains and differentials. Live scores don't count towards the table until the gameweek is final.`;

  return `<div class="live">
    <div class="live-top">${tag}${prov}</div>
    <div class="live-fx">${rows}</div>
    <div class="live-foot">${foot}</div>
  </div>`;
}

function bindHandlers(){
  document.querySelectorAll(".card").forEach(c =>
    c.addEventListener("click", (e) => {
      if(e.target.closest("[data-fx]")) return;   // let fixture rows open the modal
      c.classList.toggle("open");
    }));
  document.querySelectorAll("[data-fx]").forEach(el =>
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if(e.target.closest("a")) return;           // any links still work
      openFixture(el.getAttribute("data-fx"));
    }));
}

function chart(data){
  const gws = data.gameweeks;
  const W = 700, H = 260, padL = 30, padR = 14, padT = 14, padB = 28;
  const maxY = Math.max(4, data.totals.geese, data.totals.bbbsas);
  const n = gws.length;
  const xAt = (i) => padL + (n<=1 ? 0 : (i/(n-1))*(W-padL-padR)) + (n<=1 ? (W-padL-padR)/2 : 0);
  const yAt = (v) => padT + (1 - v/maxY)*(H-padT-padB);

  // horizontal gridlines
  let grid = "", ticks = Math.min(maxY, 6), step = Math.ceil(maxY/ticks);
  for(let v=0; v<=maxY; v+=step){
    const y = yAt(v);
    grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    grid += `<text class="axis-txt" x="${padL-6}" y="${y+3}" text-anchor="end">${v}</text>`;
  }
  // x labels (thin out if crowded)
  let xl = "", everyN = n>10 ? 2 : 1;
  gws.forEach((d,i)=>{ if(i%everyN===0 || i===n-1){
    xl += `<text class="axis-txt" x="${xAt(i)}" y="${H-8}" text-anchor="middle">${d.gw}</text>`; }});

  const line = (key,col)=>{
    const pts = gws.map((d,i)=>`${xAt(i)},${yAt(d[key])}`).join(" ");
    const marks = gws.map((d,i)=>`<circle class="race-mark" cx="${xAt(i)}" cy="${yAt(d[key])}" r="4" fill="${col}"/>`).join("");
    return `<polyline class="race-line" points="${pts}" stroke="${col}"/>${marks}`;
  };

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative H2H points by gameweek">
    ${grid}${xl}
    ${line("cum_bbbsas","#8b5cf6")}
    ${line("cum_geese","#1f8ef1")}
  </svg>`;
}

function gwCard(data, d){
  const geeseWin = d.winner === data.teams.geese.name;
  const bbbsasWin = d.winner === data.teams.bbbsas.name;
  const col = geeseWin ? "var(--geese)" : bbbsasWin ? "var(--bbbsas)" : "var(--draw)";
  const label = geeseWin ? "FPL Geese" : bbbsasWin ? "BBBSAS" : "Draw";
  const fixtures = d.fixtures.map(f=>{
    const gw2 = f.winner === data.teams.geese.name, bw = f.winner === data.teams.bbbsas.name;
    const scCls = gw2 ? "g" : bw ? "b" : "d";
    const key = fxKey(d.gw, f.geese_player, f.bbbsas_player);
    FIXTURE_INDEX[key] = {fixture:f, gw:d.gw};
    return `<div class="fx clickable" data-fx="${key}">
      <span class="nm" title="${f.geese_player}">${f.geese_player}</span>
      <span class="sc ${scCls}">${f.geese_score}${EN_DASH}${f.bbbsas_score}</span>
      <span class="nm" style="text-align:right" title="${f.bbbsas_player}">${f.bbbsas_player}</span>
    </div>`;
  }).join("");
  return `<div class="card" style="border-top:3px solid ${col}">
    <div class="gw">GW ${d.gw}</div>
    <div class="cscore" style="color:${col}">${d.score}</div>
    <div class="cwin" style="color:${col}">${label}</div>
    <div class="fixtures">${fixtures}</div>
  </div>`;
}

// ---- Fixture detail modal -------------------------------------------------
const FIXTURE_INDEX = {};   // key -> {fixture, gw}

function fxKey(gw, g, b){ return `${gw}|${g}|${b}`; }

const CHIP_NAMES = {
  bboost: "Bench Boost", "3xc": "Triple Captain",
  freehit: "Free Hit", wildcard: "Wildcard", manager: "Assistant Manager"
};
function chipTag(chip){
  if(!chip) return "";
  const nm = CHIP_NAMES[chip] || chip;
  return ` <span class="tagmini" style="color:#f4c95d;border-color:rgba(240,180,41,.4)">${nm}</span>`;
}

function cell(p, side){
  if(!p) return `<td class="nm ${side==='r'?'r':''} blank">—</td><td class="pt blank">·</td>`;
  const club = p.team ? `<span class="club">${p.team}</span>` : "";
  const nm = side==='r'
    ? `<td class="nm r">${p.name}${club}</td>`
    : `<td class="nm">${p.name}${club}</td>`;
  const pt = `<td class="pt ${side==='r'?'b':'g'}">${p.points}</td>`;
  return side==='r' ? pt + nm : nm + pt;
}

function comparisonTable(f, d){
  const g = d.geese, b = d.bbbsas;
  const rows = Math.max(g.differentials.length, b.differentials.length);

  let body = "";
  // Captain row first — the single biggest swing in most fixtures.
  const gc = g.captain, bc = b.captain;
  body += `<tr class="caprow">`
    + (gc ? `<td class="nm"><span class="capmark">C</span>${gc.name}
             <span class="club">${gc.team||""}</span></td>
            <td class="pt g">${gc.haul}</td>`
          : `<td class="nm blank">—</td><td class="pt blank">·</td>`)
    + (bc ? `<td class="pt b">${bc.haul}</td>
            <td class="nm r">${bc.name}<span class="club">${bc.team||""}</span></td>`
          : `<td class="pt blank">·</td><td class="nm r blank">—</td>`)
    + `</tr>`;

  for(let i=0; i<rows; i++){
    body += `<tr>${cell(g.differentials[i],"l")}${cell(b.differentials[i],"r")}</tr>`;
  }

  const net = g.diff_points - b.diff_points;
  const netTxt = net === 0 ? "Level"
    : `${net > 0 ? f.geese_player : f.bbbsas_player} +${Math.abs(net)}`;
  const netCol = net === 0 ? "var(--muted)"
    : (net > 0 ? "var(--geese)" : "var(--bbbsas)");

  return `<div class="cmpwrap"><table class="cmp">
    <thead><tr>
      <th class="l" colspan="2">${f.geese_player}${chipTag(g.chip)}</th>
      <th class="r" colspan="2">${chipTag(b.chip)}${f.bbbsas_player}</th>
    </tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr>
      <td class="lab">Differential total</td>
      <td class="pt g">${g.diff_points}</td>
      <td class="pt b">${b.diff_points}</td>
      <td class="lab" style="text-align:right;color:${netCol}">${netTxt}</td>
    </tr></tfoot>
  </table></div>`;
}

function openFixture(key){
  const rec = FIXTURE_INDEX[key];
  if(!rec) return;
  const {fixture:f, gw} = rec;
  const d = f.detail;
  const gCol = "var(--geese)", bCol = "var(--bbbsas)";
  const gScore = (f.geese_score !== undefined) ? f.geese_score : "–";
  const bScore = (f.bbbsas_score !== undefined) ? f.bbbsas_score : "–";

  let body;
  if(!d){
    body = `<div class="nodiff" style="padding:22px 18px">
      Squad detail isn't available for this fixture yet. Picks become visible
      once the gameweek deadline has passed.</div>`;
  }else{
    const same = d.same_captain
      ? `<div class="samecap">Both captained the same player — no captaincy swing.</div>` : "";
    const noDiffs = !d.geese.differentials.length && !d.bbbsas.differentials.length;
    body = same
      + `<div class="sectlbl">Captain &amp; differentials</div>`
      + comparisonTable(f, d)
      + (noDiffs ? `<div class="nodiff">Identical players on the pitch.</div>` : "")
      + `<div class="swing">${d.shared_count} players shared on the pitch, so they cancel out.
         Only the players above separate them. Bench players are excluded unless
         Bench Boost is active.</div>`;
  }

  q("#sheet").innerHTML = `
    <div class="sheet-top">
      <div>
        <div class="sheet-title">
          <span style="color:${gCol}">${f.geese_player}</span>
          <span style="color:var(--muted)">${gScore} ${EN_DASH} ${bScore}</span>
          <span style="color:${bCol}">${f.bbbsas_player}</span>
        </div>
        <div class="sheet-sub">Gameweek ${gw} · captains and squad differentials</div>
      </div>
      <button class="xbtn" id="closeModal" aria-label="Close">&times;</button>
    </div>${body}`;

  q("#modal").classList.add("open");
  document.body.style.overflow = "hidden";
  q("#closeModal").addEventListener("click", closeModal);
}

function closeModal(){
  q("#modal").classList.remove("open");
  document.body.style.overflow = "";
}

q("#modal").addEventListener("click", (e)=>{ if(e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeModal(); });

function load(){
  return fetch("data.json?" + Date.now())
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(err => {
      q("#app").innerHTML =
        `<div class="empty"><h3>Couldn't load the league</h3>
         <p>data.json is missing or unreadable (${err.message}). Once the update job has run
         at least once, the scores will appear here.</p></div>`;
    });
}

const btn = q("#refresh"), btnLabel = q("#refresh-label");
btn.addEventListener("click", () => {
  btn.disabled = true; btn.classList.add("spin"); btnLabel.textContent = "Refreshing";
  const started = Date.now();
  load().finally(() => {
    // brief minimum spin so the tap registers visually
    setTimeout(() => {
      btn.disabled = false; btn.classList.remove("spin"); btnLabel.textContent = "Refresh";
    }, Math.max(0, 450 - (Date.now() - started)));
  });
});

// Keep the "x mins ago" honest without re-fetching.
setInterval(() => {
  if(LAST_DATA) q("#stamp-txt").textContent = fmtStamp(LAST_DATA.generated_at);
}, 30000);

// Re-check when the tab regains focus (e.g. coming back mid-match).
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") load();
});

load();
</script>
</body>
</html>
